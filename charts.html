<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charts — Billboard Hot 100 | Celestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .chart-search-wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 24px 6px;
  }
  .chart-search-box{
    display:flex;
    align-items:center;
    gap:10px;
    border:1.5px solid var(--ink);
    border-radius:999px;
    padding:12px 20px;
    background:transparent;
  }
  .chart-search-box svg{ flex-shrink:0; opacity:0.6; }
  #chartSearch{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Inter', sans-serif;
    font-size:1rem;
    color:var(--ink);
  }
  #chartSearch::placeholder{ color:var(--ink); opacity:0.45; }

  .chart-meta-bar{
    max-width:900px;
    margin:0 auto;
    padding:0 24px 30px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    color:var(--ink);
    opacity:0.6;
  }

  .chart-list{
    max-width:900px;
    margin:0 auto;
    padding:0 24px 80px;
  }
  .chart-row{
    display:grid;
    grid-template-columns:52px 44px 56px 1fr auto 40px;
    align-items:center;
    gap:14px;
    padding:14px 6px;
    border-bottom:1px solid rgba(0,0,0,0.08);
  }
  .chart-cover{
    width:56px;
    height:56px;
    border-radius:4px;
    object-fit:cover;
    display:block;
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
  }
  .chart-cover-placeholder{
    background:linear-gradient(135deg, #e8e4f5, #f5e8f0);
  }
  .chart-spotify{
    display:flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    border-radius:50%;
    color:#1DB954;
    opacity:0.75;
    transition:opacity .15s ease, transform .15s ease;
  }
  .chart-spotify:hover{ opacity:1; transform:scale(1.08); }
  .chart-rank{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.7rem;
    color:var(--ink);
    text-align:center;
  }
  .chart-movement{
    font-family:'Inter', sans-serif;
    font-weight:800;
    font-size:0.75rem;
    text-align:center;
    padding:4px 0;
    border-radius:4px;
  }
  .chart-movement.up{ color:#1B8A4A; }
  .chart-movement.down{ color:#C23B3B; }
  .chart-movement.same{ color:#9a94ac; }
  .chart-movement.new{
    background:var(--violet);
    color:#fff;
    padding:3px 6px;
    font-size:0.65rem;
  }
  .chart-title-block h3{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0 0 3px;
  }
  .chart-title-block h3 a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .chart-title-block h3 a:hover{
    border-bottom-color:var(--violet);
    color:var(--violet);
  }
  .chart-title-block p{
    margin:0;
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
    color:#5c5670;
  }
  .chart-weeks{
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    color:#9a94ac;
    text-align:right;
    white-space:nowrap;
  }
  #chartStatus{
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.1rem;
    color:var(--ink);
    opacity:0.7;
    padding:60px 20px;
  }
  @media (max-width:600px){
    .chart-row{ grid-template-columns:30px 28px 44px 1fr 32px; gap:10px; }
    .chart-weeks{ display:none; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Celestine<span></span></a>
  <nav>
    <a href="bios.html">Artist bios</a>
    <a href="film.html">Film</a>
    <a href="music.html">Music</a>
    <a href="charts.html">Charts</a>
    <a href="news.html">News</a>
    <a href="about.html">About</a>
  </nav>
</header>

<div class="masthead" style="border-bottom:3px solid var(--ink);">
  <span class="tag">Charts</span>
  <h1>The <em>Hot 100</em></h1>
  <p class="dek">Billboard's official singles chart, refreshed automatically — the actual ranking updates weekly, every Tuesday.</p>
</div>

<div class="chart-search-wrap">
  <div class="chart-search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input type="text" id="chartSearch" placeholder="Search this week's chart…" aria-label="Search the Hot 100" autocomplete="off">
  </div>
</div>

<div class="chart-meta-bar">
  <span id="chartDateLabel">Loading chart…</span>
  <span id="chartUpdatedLabel"></span>
</div>

<section>
  <div class="chart-list" id="chartList"></div>
  <p id="chartStatus" style="display:none;"></p>
</section>

<footer>
  <a href="index.html" class="logo">Celestine<span></span></a>
  <div class="socials">
    <a href="https://youtube.com/@celestinestudio" target="_blank">YouTube</a>
    <a href="https://www.instagram.com/celestine_studio_" target="_blank">Instagram</a>
    <a href="https://web.facebook.com/profile.php?id=61594418093291" target="_blank">Facebook</a>
  </div>
  <div class="fine">© 2026 Celestine Studio. All rights reserved.</div>
</footer>

<script>
  (function() {
    var listEl = document.getElementById('chartList');
    var statusEl = document.getElementById('chartStatus');
    var dateLabel = document.getElementById('chartDateLabel');
    var updatedLabel = document.getElementById('chartUpdatedLabel');
    var searchInput = document.getElementById('chartSearch');
    var allEntries = [];

    function movementSymbol(m) {
      if (m === 'up') return '▲';
      if (m === 'down') return '▼';
      if (m === 'new') return 'NEW';
      return '–';
    }

    function renderRows(entries) {
      listEl.innerHTML = '';
      if (entries.length === 0) {
        statusEl.textContent = 'No songs match that search.';
        statusEl.style.display = 'block';
        return;
      }
      statusEl.style.display = 'none';
      entries.forEach(function(e) {
        var row = document.createElement('div');
        row.className = 'chart-row';
        var coverArt = e.coverArt
          ? '<img class="chart-cover" src="' + e.coverArt + '" alt="Cover art for ' + e.title + '" loading="lazy">'
          : '<div class="chart-cover chart-cover-placeholder"></div>';
        row.innerHTML =
          '<div class="chart-rank">' + e.rank + '</div>' +
          '<div class="chart-movement ' + e.movement + '">' + movementSymbol(e.movement) + '</div>' +
          coverArt +
          '<div class="chart-title-block"><h3><a href="songs/' + e.slug + '.html">' + e.title + '</a></h3><p>' + e.artist + '</p></div>' +
          '<div class="chart-weeks">' + e.weeks + (e.weeks === 1 ? ' week' : ' weeks') + ' &middot; Peak #' + e.peak + '</div>' +
          '<a class="chart-spotify" href="' + e.spotifyUrl + '" target="_blank" rel="noopener" aria-label="Find on Spotify"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.6 14.4c-.2.3-.6.4-.9.2-2.5-1.5-5.6-1.9-9.3-1-.4.1-.7-.1-.8-.5-.1-.4.1-.7.5-.8 4-.9 7.5-.5 10.3 1.2.3.2.4.6.2.9zm1.2-2.8c-.2.3-.7.5-1 .3-2.9-1.8-7.3-2.3-10.7-1.2-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 3.9-1.2 8.7-.6 12 1.4.3.2.4.7.2 1zm.1-2.9C14.3 8.7 8.7 8.5 5.4 9.5c-.5.1-1-.2-1.1-.6-.1-.5.2-1 .6-1.1 3.8-1.1 10-.9 13.8 1.4.4.2.5.8.3 1.2-.3.4-.9.5-1.3.3z"/></svg></a>';
        listEl.appendChild(row);
      });
    }

    fetch('data/hot100.json')
      .then(function(res) {
        if (!res.ok) throw new Error('not found');
        return res.json();
      })
      .then(function(data) {
        allEntries = data.entries || [];
        dateLabel.textContent = 'Chart dated ' + data.chartDate;
        var fetched = new Date(data.fetchedAt);
        updatedLabel.textContent = 'Last checked ' + fetched.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        renderRows(allEntries);
      })
      .catch(function() {
        dateLabel.textContent = 'Chart data not available yet';
        statusEl.textContent = "The chart hasn't been fetched yet — once the daily automation runs for the first time, it'll appear here.";
        statusEl.style.display = 'block';
      });

    searchInput.addEventListener('input', function() {
      var q = searchInput.value.trim().toLowerCase();
      var filtered = allEntries.filter(function(e) {
        return e.title.toLowerCase().indexOf(q) !== -1 || e.artist.toLowerCase().indexOf(q) !== -1;
      });
      renderRows(filtered);
    });
  })();
</script>

</body>
</html>
