name: Update Billboard Hot 100

on:
  schedule:
    # Runs daily at 06:00 UTC. The chart itself only updates weekly
    # (Tuesdays), but checking daily means the site is never more than
    # a day behind whenever Billboard does publish a new one.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch chart
        run: python scripts/fetch_chart.py

      - name: Generate new song pages
        run: node scripts/generate-song-pages.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Open pull request with changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Auto: update Hot 100 chart + new song pages"
          title: "Chart update — new songs for review"
          body: |
            Automated daily run:
            - Refreshed `data/hot100.json` from Billboard's Hot 100
            - Generated pages under `songs/` for any songs new to the chart
              (existing pages are never touched or overwritten)

            Song pages include an AI-drafted note (Gemini) clearly marked
            as a draft — review before merging, same as the news workflow.
          branch: auto/chart-update
          delete-branch: true
