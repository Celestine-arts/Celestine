name: Update Billboard Hot 100

on:
  schedule:
    # Runs daily at 06:00 UTC. The chart itself only updates weekly
    # (Tuesdays), but checking daily means the site is never more than
    # a day behind whenever Billboard does publish a new one.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch chart
        run: python scripts/fetch_chart.py

      # Runs BEFORE generate-song-pages.mjs on purpose: a brand-new
      # artist's bio needs to exist before their first song page is
      # generated, so the song -> bio link is there from day one
      # (song pages are never rewritten once created, so a missed link
      # here would stay missing forever).
      - name: Generate artist bio pages
        run: node scripts/generate-artist-bios.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate new song pages
        run: node scripts/generate-song-pages.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Open pull request with changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Auto: update Hot 100 chart + new song/artist pages"
          title: "Chart update — new songs & artists for review"
          body: |
            Automated daily run:
            - Refreshed `data/hot100.json` from Billboard's Hot 100
            - Merged today's chart into the persistent `data/songs-index.json`
              catalog (songs never drop out of this file once seen)
            - Generated bio pages for any artist new to the chart, grounded
              in their Wikipedia summary where one exists (added to
              `bio-index.json`)
            - Generated pages under `songs/` for any songs new to the chart,
              linking to the artist's bio when one is available
              (existing pages are never touched or overwritten)

            Song and artist pages include an AI-drafted note (Gemini)
            clearly marked as a draft — review before merging, same as the
            news workflow.
          branch: auto/chart-update
          delete-branch: true
